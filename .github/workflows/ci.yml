name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: ./gradlew clean check

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: .\gradlew.bat clean check

      - name: Show downloader test failure
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: Get-Content -Raw 'launcher-downloader/build/test-results/test/TEST-com.launcher.downloader.download.DefaultFileDownloaderTest.xml'
