name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: ./gradlew clean buildSrc:check check

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: .\gradlew.bat clean buildSrc:check check
